name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q

  cleanroom:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Wheel release check (PDF and no-PDF)
        run: python tools/cleanroom.py

  # The one check branch protection requires: it passes only when every
  # matrix job passed, so adding a Python version needs no ruleset edit.
  ci-ok:
    if: always()
    needs: [test, cleanroom]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        env:
          TEST: ${{ needs.test.result }}
          CLEANROOM: ${{ needs.cleanroom.result }}
        run: test "$TEST" = success && test "$CLEANROOM" = success
