[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "siftfetch"
version = "0.1.0"
description = "Guardrails for AI coding agents that use the web: what they send, what they open, and what they see."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "XRMech" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=6.1",
    "readability-lxml>=0.8.1",
    "markdownify>=0.11.6",
    "ddgs>=9.0",
    "mcp>=2.3,<3",
    # Minimums with known advisories fixed.
    "brotli>=1.2.1",
    "certifi>=2026.10.19",
]

[project.optional-dependencies]
# Real-browser reads for pages behind bot walls (off unless configured).
browser = ["playwright>=1.48"]
# The owner's signed-in browser session, for sites on the login allowlist.
logins = ["browser-cookie3>=0.19"]
test = ["pytest>=8"]

[project.scripts]
siftfetch-server = "siftfetch.server:main"
siftfetch-hook = "siftfetch.hook:main"

[project.urls]
Homepage = "https://github.com/XRMech/siftfetch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
siftfetch = ["injection_patterns.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
